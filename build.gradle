plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.13+" apply false
    id("me.shedaniel.unified-publishing") version("0.1.+")
    id "idea"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "java"
    apply plugin: "me.shedaniel.unified-publishing"

    archivesBaseName = "${rootProject.archives_base_name}-${minecraft_version}"
    version = rootProject.mod_version
    group = rootProject.maven_group

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
        mavenLocal()

        maven { url = "https://cursemaven.com" } // CurseForge maven
        maven { url = "https://api.modrinth.com/maven" } // Modrinth maven

        maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
        maven { url = "https://maven.tterrag.com/" } // Forge Registrate

        maven { url = "https://maven.createmod.net" } // Create Forge, Ponder, Flywheel

        maven { url = "https://mvn.devos.one/snapshots/" } // Create Fabric, Fabric Registrate

        maven { url = "https://maven.idiotss.com/releases/" } // ESL

        maven { url = "https://maven.blamejared.com/" } // JEI

        // Create dependencies
        maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes

        maven { url = "https://jitpack.io/" } // Mixin Extras

        maven { url "https://modmaven.dev/" } // Applied Energistics 2

    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // The following line declares the mojmap mappings, you may use other mappings as well
        // The following line declares the yarn mappings you may select this one as well.
        // mappings "net.fabricmc:yarn:@YARN_MAPPINGS@:v2"
        mappings loom.layered() {
            officialMojangMappings()
            //parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

